name: Build & Release XCODING

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.1.0)'
        required: true
        default: 'v1.1.0'

jobs:
  build-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow

      - name: Pack Assets & Build Windows Executable
        run: |
          cmd.exe /c "build.bat"

      - name: Create GitHub Release & Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: bin/XCODING.exe
          tag_name: ${{ github.ref_name || github.event.inputs.version }}
          name: XCODING ${{ github.ref_name || github.event.inputs.version }}
          body: |
            Automated Release for XCODING Standalone C++ Student IDE.
            - Single portable `.exe` with zero external DLL dependencies.
            - Embedded Monaco Editor & Level Train Stepper navigation.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
